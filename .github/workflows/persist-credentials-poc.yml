name: PoC - persist-credentials check

# Manual trigger only - run this from the Actions tab on your own fork.
# Does NOT touch angular/components, only your own fork's copy.
on:
  workflow_dispatch:

jobs:
  vulnerable-config:
    name: "Vulnerable (no persist-credentials: false)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (default settings - this is the current state of the flagged workflows)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check whether the credential is still on disk
        run: |
          echo "Simulating: this could be ANY later step - a third-party action, an npx package, etc."
          if git config --local --get "http.https://github.com/.extraheader" > /dev/null 2>&1; then
            echo "::warning::CREDENTIAL IS STILL PRESENT in .git/config after checkout."
            echo "Any code running later in this job could read it. Not printing the value itself."
          else
            echo "Credential not found (unexpected for this job - should reproduce the issue)."
          fi

  fixed-config:
    name: "Fixed (persist-credentials: false)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with the recommended fix)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check whether the credential is still on disk
        run: |
          if git config --local --get "http.https://github.com/.extraheader" > /dev/null 2>&1; then
            echo "::warning::Credential present (unexpected - fix should have removed it)."
          else
            echo "Credential correctly absent. Later steps in this job cannot read a token that isn't there."
          fi
