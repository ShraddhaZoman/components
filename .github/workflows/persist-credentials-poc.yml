name: PoC - persist-credentials check

# Manual trigger only - run this from the Actions tab on your own fork.
# Does NOT touch angular/components, only your own fork's copy.
on:
  workflow_dispatch:

# Explicit write scope so the vulnerable/fixed comparison isn't muddied by
# ambient default-token permissions - this represents the worst-case combo
# (missing persist-credentials: false + a write-scoped token), which is the
# highest-severity version of this issue for any real workflow that has it.
permissions:
  contents: write

jobs:
  vulnerable-config:
    name: "Vulnerable (no persist-credentials: false)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (default settings - this is the current state of the flagged workflows)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Simulate a later step abusing the persisted credential
        run: |
          echo "Simulating: this could be ANY later step - a third-party action, an npx package, etc."

          # Structural check: newer checkout versions store the token in a
          # separate file under $RUNNER_TEMP and wire it in via a conditional
          # includeIf, instead of a top-level http.*.extraheader entry.
          if git config --local --get-regexp '^includeif\.gitdir' > /dev/null 2>&1; then
            echo "::warning::A conditional credential include is present in .git/config."
          else
            echo "No includeIf credential entry found."
          fi

          # Functional check: can this step authenticate and push, despite
          # never having been given a credential of its own? --dry-run still
          # performs the full auth handshake with the remote, it just skips
          # actually writing anything - nothing in the real repo changes.
          git checkout -b poc-credential-check-scratch
          echo "poc test $(date +%s)" >> POC_CREDENTIAL_CHECK.txt
          git -c user.email="poc@example.com" -c user.name="poc" add POC_CREDENTIAL_CHECK.txt
          git -c user.email="poc@example.com" -c user.name="poc" commit -q -m "poc: scratch commit, never actually pushed (dry-run only)"

          if git push --dry-run origin poc-credential-check-scratch 2>&1 | tee /tmp/push_test.log; then
            echo "::warning::A later step authenticated and could push, using a credential it was never directly given."
          else
            echo "Push failed - no usable implicit credential (unexpected for this job - should reproduce the issue)."
          fi

  fixed-config:
    name: "Fixed (persist-credentials: false)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with the recommended fix)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Confirm a later step has no implicit credential
        run: |
          if git config --local --get-regexp '^includeif\.gitdir' > /dev/null 2>&1; then
            echo "::warning::Unexpected - includeIf credential entry present even with persist-credentials: false."
          else
            echo "Credential correctly absent (no includeIf entry)."
          fi

          git checkout -b poc-credential-check-scratch
          echo "poc test $(date +%s)" >> POC_CREDENTIAL_CHECK.txt
          git -c user.email="poc@example.com" -c user.name="poc" add POC_CREDENTIAL_CHECK.txt
          git -c user.email="poc@example.com" -c user.name="poc" commit -q -m "poc: scratch commit, never actually pushed (dry-run only)"

          if git push --dry-run origin poc-credential-check-scratch 2>&1 | tee /tmp/push_test.log; then
            echo "::warning::Unexpected - push succeeded with no persisted credential."
          else
            echo "Push correctly failed - later steps cannot authenticate without a credential of their own."
          fi
